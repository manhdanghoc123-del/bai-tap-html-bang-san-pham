<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        /* Thêm CSS cơ bản để bảng nhìn rõ ràng và đẹp mắt hơn */
        table {
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
            margin-top: 15px;
            font-family: Arial, sans-serif;
        }

        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px 12px;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>

    <table>
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Laptop Dell XPS 13</td>
                <td>25.000.000 VNĐ</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Điện thoại iPhone 15</td>
                <td>22.500.000 VNĐ</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Tai nghe Bluetooth Sony</td>
                <td>3.200.000 VNĐ</td>
                <td>25</td>
            </tr>
            <tr>
                <td>Bàn phím cơ Logitech</td>
                <td>1.800.000 VNĐ</td>
                <td>30</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
